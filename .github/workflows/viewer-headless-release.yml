name: Viewer Release

on:
  push:
    tags:
      - "viewer-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  version-consistency:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release tag and embedded versions
        shell: bash
        run: node viewer-headless/scripts/check-release-version.js "$GITHUB_REF_NAME"

  linux-docker:
    needs:
      - version-consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: viewer-headless/package-lock.json

      - name: Check worker
        working-directory: viewer-headless
        run: |
          npm ci
          npm run check
          npm test

      - name: Build Linux archive
        run: |
          mkdir -p dist
          tar \
            --exclude='viewer-headless/node_modules' \
            --exclude='viewer-headless/profiles' \
            --exclude='viewer-headless/.env' \
            -czf dist/evosurf-viewer-headless-linux.tar.gz \
            viewer-headless electron/viewer-core

      - name: Upload Linux archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: evosurf-viewer-headless-linux
          path: dist/evosurf-viewer-headless-linux.tar.gz

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: evosurf
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME:-manual}"
          version="${version#viewer-v}"
          version="${version#viewer-headless-v}"
          ghcr_image="ghcr.io/${owner}/evosurf-viewer-headless"
          dockerhub_image="evosurf/viewer"
          docker build \
            -f viewer-headless/Dockerfile \
            -t "${ghcr_image}:latest" \
            -t "${ghcr_image}:${version}" \
            -t "${dockerhub_image}:stable" \
            -t "${dockerhub_image}:latest" \
            -t "${dockerhub_image}:${version}" \
            .
          docker push "${ghcr_image}:latest"
          docker push "${ghcr_image}:${version}"
          docker push "${dockerhub_image}:stable"
          docker push "${dockerhub_image}:latest"
          docker push "${dockerhub_image}:${version}"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: evosurf
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: evosurf/viewer
          readme-filepath: ./viewer-headless/DOCKERHUB_README.md
          short-description: Official EvoSurf headless viewer for Docker.

  windows:
    needs:
      - version-consistency
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: electron/package-lock.json

      - name: Build Windows viewer
        working-directory: electron
        env:
          CLIENT_URL: https://www.evosurf.fr/surf/client
        run: |
          npm ci
          npm run test:security
          npm run build

      - name: Verify Windows update artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem electron/dist/EvoSurfViewer-win-*.exe
          $manifest = Get-Item electron/dist/latest.yml
          if (-not $installer -or -not $manifest) {
            throw "The Windows installer or latest.yml update manifest is missing."
          }

      - name: Upload Windows update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evosurf-viewer-windows
          path: |
            electron/dist/EvoSurfViewer-win-*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  release:
    needs:
      - linux-docker
      - windows
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME:-viewer-manual}"
          files="$(find dist -type f)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "$tag" --notes "EvoSurf viewer Windows installer, headless Linux archive and Docker image."
          fi
          gh release edit "$tag" --draft=false --prerelease=false --title "$tag"
