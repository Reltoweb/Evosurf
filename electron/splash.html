<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EvoSurf Viewer</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --orange: #ea580c;
            --amber: #f59e0b;
            --ring: rgba(234, 88, 12, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 32%, rgba(245, 158, 11, 0.13), transparent 34%),
                linear-gradient(180deg, #fff7ed 0%, var(--bg) 48%, #eef2f7 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell {
            width: min(340px, calc(100vw - 48px));
            text-align: center;
        }

        .logo-wrap {
            position: relative;
            display: grid;
            place-items: center;
            width: 136px;
            height: 136px;
            margin: 0 auto 24px;
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(234, 88, 12, 0.08);
        }

        .logo-wrap::before,
        .logo-wrap::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 34px;
            border: 2px solid var(--ring);
            animation: pulse 1.8s ease-out infinite;
        }

        .logo-wrap::after {
            animation-delay: 0.55s;
        }

        .logo {
            width: 86px;
            height: 86px;
            object-fit: contain;
            animation: float 2.8s ease-in-out infinite;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            line-height: 1.1;
            font-weight: 850;
            letter-spacing: 0;
        }

        p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
        }

        .bar {
            position: relative;
            height: 5px;
            margin: 26px auto 0;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.22);
        }

        .bar::before {
            content: "";
            position: absolute;
            inset: 0;
            width: 38%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--orange), var(--amber));
            animation: loading 1.25s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }

        @keyframes pulse {
            0% { opacity: 0.9; transform: scale(0.92); }
            100% { opacity: 0; transform: scale(1.18); }
        }

        @keyframes loading {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(270%); }
        }
    </style>
</head>
<body>
    <main class="shell" aria-label="Chargement EvoSurf">
        <div class="logo-wrap">
            <img class="logo" src="icon.png" alt="EvoSurf">
        </div>
        <h1>EvoSurf Viewer</h1>
        <p>Chargement de la visionneuse</p>
        <div class="bar" aria-hidden="true"></div>
    </main>
</body>
</html>
